name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-tests:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The newest Xcode on macos-15 ships Swift 6.2.4, which rejects the
      # DispatchQueue.main.async + @MainActor pattern in DocumentStore+OCR with
      # "sending 'self' risks causing data races". Swift 6.3 accepts it, and 6.3.3
      # is what the developer and the release pipeline actually build with
      # (script/build_linux_release.sh pins the swift:6.3.3 image too). Installing
      # the official toolchain makes CI test the compiler we ship with instead of
      # whatever Xcode the runner image happens to carry.
      #
      # download.swift.org needs the directory segment lowercased
      # (swift-6.3.3-release) while the file keeps -RELEASE — getting that wrong
      # 404s, which is what made this job look like "Windows/macOS has no
      # toolchain". Swift publishes no .sha256/.sig sidecar next to these
      # artifacts (all 404), so integrity rests on HTTPS to download.swift.org.
      - name: Install official Swift 6.3.3 toolchain
        run: |
          set -euo pipefail
          url='https://download.swift.org/swift-6.3.3-release/xcode/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-osx.pkg'
          curl -fL --retry 3 -o "$RUNNER_TEMP/swift.pkg" "$url"
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          echo 'TOOLCHAINS=swift' >> "$GITHUB_ENV"
      - name: Show toolchain in use
        run: swift --version
      - name: Test
        run: swift test
      # Both gates below shelled out to ripgrep, which this runner does not have,
      # and `if rg ...; then fail; fi` reads a missing binary (exit 127) as "no
      # match" — so both reported "passed" here without scanning a single file,
      # for as long as this job has existed. A gate that cannot fail is not a
      # gate, and README.md tells users CI blocks networking APIs. Plant a real
      # violation on every run and require the gate to catch it.
      - name: Audit local-first policy
        run: |
          ./script/audit_local_first.sh
          printf 'import Foundation\nlet probe = URLSession.shared\n' > Core/__ci_probe.swift
          if ./script/audit_local_first.sh >/dev/null 2>&1; then
            rm -f Core/__ci_probe.swift
            echo "Local-first gate ignored a planted URLSession: it is not scanning." >&2
            exit 1
          fi
          rm -f Core/__ci_probe.swift
      - name: Audit portable core boundary
        run: |
          ./script/audit_portable_core.sh
          printf 'import PDFKit\n' > Core/__ci_probe.swift
          if ./script/audit_portable_core.sh >/dev/null 2>&1; then
            rm -f Core/__ci_probe.swift
            echo "Portable-core gate ignored a planted PDFKit import: it is not scanning." >&2
            exit 1
          fi
          rm -f Core/__ci_probe.swift
      - name: Audit i18n strings
        run: |
          ./script/audit_i18n_strings.sh --self-test && ./script/audit_i18n_strings.sh
          # Vỏ Flutter có gate riêng: nó từng có 142 chuỗi tiếng Việt hardcode,
          # nên UI Linux/Windows chỉ một ngôn ngữ trong khi macOS có hai.
          ./script/audit_shell_i18n.sh --self-test && ./script/audit_shell_i18n.sh
      - name: Build app bundle
        run: ./script/build_and_run.sh --bundle
      - name: Validate release scripts
        run: |
          bash -n script/build_and_run.sh script/build_linux_release.sh script/build_mupdf_runtime.sh script/build_ocrmypdf_runtime.sh script/build_pyhanko_runtime.sh script/build_verapdf_runtime.sh script/build_flatpak_dev.sh script/build_flatpak_source.sh script/stage_flatpak_source.sh script/lint_flatpak_manifest.sh script/test_flatpak_gui.sh script/test_flatpak_sandbox.sh script/test_flatpak_desktop_session.sh script/generate_linux_sbom.sh script/generate_sbom.sh script/package_release.sh script/sign_bundle.sh script/audit_runtime.sh script/audit_i18n_strings.sh script/audit_shell_i18n.sh
          python3 -m py_compile script/generate_flatpak_pub_sources.py
          runtime="$(mktemp -d)"
          cp /usr/bin/true "$runtime/helper"
          chmod +x "$runtime/helper"
          ./script/audit_runtime.sh "$runtime" helper
          printf '#!/usr/bin/env python3\n' > "$runtime/python-helper"
          chmod +x "$runtime/python-helper"
          if ./script/audit_runtime.sh "$runtime" python-helper; then
            echo "Expected non-self-contained Python helper to fail the audit" >&2
            exit 1
          fi
          rm "$runtime/python-helper"
          ln -s /usr/bin/true "$runtime/escaping-link"
          if ./script/audit_runtime.sh "$runtime" helper; then
            echo "Expected escaping symlink to fail the audit" >&2
            exit 1
          fi
          rm -rf "$runtime"

  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: swift --version
      - name: Test portable core
        run: swift test
      - name: Build self-contained engine bridge
        run: |
          swift build -c release --build-path .build-linux-static \
            -Xswiftc -static-stdlib --product azpdf-engine
          if ldd .build-linux-static/release/azpdf-engine | grep -q 'not found'; then
            ldd .build-linux-static/release/azpdf-engine
            exit 1
          fi
      # Đối xứng với windows-core: cùng một lệnh selftest, cùng một kỳ vọng.
      #
      # Phải dựng mutool từ nguồn. Đã đo, không phải đoán: apt của Ubuntu 24.04 lẫn
      # container swift:6.3.3 chỉ có mutool 1.23.10, và chạy selftest với bản đó làm
      # ĐÚNG 3 thao tác MuPDF hỗ trợ (upsertAnnotation, upsertImageAnnotation,
      # removeAnnotation) chuyển thành `failed` → đỏ giả. mupdf.com chỉ publish
      # -source.tar.gz và -windows.zip, không có binary Linux dựng sẵn.
      #
      # Dựng từ nguồn tốn 16 giây trên máy 32 nhân (đo trong đúng container này), nên
      # trên runner vài nhân là cỡ vài phút — rẻ hơn nhiều so với ước lượng "quá nặng".
      # X11/GLUT/CURL tắt: chỉ cần mutool, không cần viewer.
      - name: Build pinned mutool 1.28.0 from source
        # Container mặc định dùng sh (dash) — không có `set -o pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq build-essential curl >/dev/null
          curl -fsSL -o /tmp/mupdf.tar.gz \
            https://casper.mupdf.com/downloads/archive/mupdf-1.28.0-source.tar.gz
          echo '21c7f064903154f1c3a7458bee81f130fc36f9b5147ea13328f9980e02d2dea2  /tmp/mupdf.tar.gz' \
            | sha256sum -c -
          tar xf /tmp/mupdf.tar.gz -C /tmp
          make -C /tmp/mupdf-1.28.0-source -j"$(nproc)" \
            HAVE_X11=no HAVE_GLUT=no HAVE_CURL=no build=release build/release/mutool
          /tmp/mupdf-1.28.0-source/build/release/mutool -v
      - name: Run azpdf-engine selftest
        # Container mặc định dùng sh (dash) — không có `set -o pipefail`.
        shell: bash
        run: |
          set -euo pipefail
          swift build --product azpdf-engine
          .build/debug/azpdf-engine selftest \
            --mutool /tmp/mupdf-1.28.0-source/build/release/mutool
      - name: Audit portable core boundary
        run: ./script/audit_portable_core.sh

  linux-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev \
            liblzma-dev libglu1-mesa
      - name: Install pinned official Flutter SDK
        run: |
          curl -fsSL \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz \
            -o "$RUNNER_TEMP/flutter.tar.xz"
          echo 'e1ec95e6c550458a34de93580cb85dac24da0e9bedb9bb42811f050ac5a0c7d5  '"$RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze and test desktop shell
        working-directory: Shell/azpdf_desktop
        run: |
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" pub get
          "$RUNNER_TEMP/flutter/bin/flutter" analyze
          "$RUNNER_TEMP/flutter/bin/flutter" test
          "$RUNNER_TEMP/flutter/bin/flutter" build linux --release

  flatpak-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install manifest validation tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            flatpak-builder jq rsync
      - name: Validate pinned offline sources and least privilege
        run: |
          ./script/generate_flatpak_pub_sources.py \
            Shell/azpdf_desktop/pubspec.lock \
            Packaging/flatpak/flutter-pub-sources.json \
            --additional-lockfile Packaging/flatpak/flutter-3.44.0-tools-pubspec.lock \
            --check
          ./script/stage_flatpak_source.sh
          ./script/lint_flatpak_manifest.sh

  windows-core:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Swift toolchain (6.3.3)
        shell: pwsh
        run: |
          # winget is not on the windows-2022 Server image, so fetch the official installer
          # directly. Pinned to 6.3.3 to match the Linux container (swift:6.3.3 in linux-core
          # and script/build_linux_release.sh) and the macOS toolchain installed above — one
          # Swift line across all three platforms, no divergence to reason about.
          $ver = '6.3.3'
          # Directory segment is lowercase (swift-6.3.3-release); the file name keeps
          # -RELEASE. Mixing the case 404s, which is what previously made this look
          # like "Swift 6.3.3 has no Windows installer" — it does.
          $base = "https://download.swift.org/swift-${ver}-release/windows10/swift-${ver}-RELEASE"
          $exe = Join-Path $env:RUNNER_TEMP "swift-${ver}-RELEASE-windows10.exe"
          curl.exe -fL "$base/swift-${ver}-RELEASE-windows10.exe" -o $exe
          # No integrity sidecar to check: .sha256, .sha512 and .sig all 404 next to
          # this artifact, unlike the Flutter SDK zip which does publish one. So the
          # download is trusted on HTTPS to download.swift.org alone. Pin a hash here
          # the day Swift starts publishing one.
          Write-Host "Downloaded Swift ${ver} installer ($((Get-Item $exe).Length) bytes)"
          # -PassThru is what makes the exit code observable. Without it a failed
          # install counted as success and only surfaced later as a baffling
          # "Cannot find path 'C:\Program Files\Swift\'" — the error we actually got.
          # 3010 means "succeeded, reboot pending", which is harmless: the toolchain
          # is usable in place and this runner is discarded after the job.
          $proc = Start-Process -FilePath $exe `
            -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 3010)) {
            throw "Swift installer exited with $($proc.ExitCode)."
          }
          # swift.org documents winget as the only Windows install route and never
          # states where this .exe puts the toolchain. winget is absent from the
          # windows-2022 image (it is not in that image's software manifest), so the
          # .exe is the only option and its install root has to be discovered rather
          # than hardcoded — hardcoding one guess is what broke the previous attempt.
          $roots = @(
            "$env:ProgramFiles\Swift"
            "${env:ProgramFiles(x86)}\Swift"
            "$env:LOCALAPPDATA\Programs\Swift"
          ) | Where-Object { $_ -and (Test-Path $_) }
          if (-not $roots) {
            throw ("Installer reported success ($($proc.ExitCode)) but no Swift root " +
                   "exists under Program Files, Program Files (x86) or LOCALAPPDATA.")
          }
          Write-Host "Swift roots present: $($roots -join ', ')"
          $swift = Get-ChildItem $roots -Recurse -Filter swift.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $swift) { throw "No swift.exe under: $($roots -join ', ')" }
          Write-Host "Using $($swift.FullName)"
          $swift.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Measured: the installer lands in %LOCALAPPDATA%\Programs\Swift, never
          # in Program Files. It splits the compiler (Toolchains\) from the Swift
          # runtime DLLs (Runtimes\), and swift.exe links against the latter — with
          # only Toolchains on PATH, `swift --version` exits 1 in about a second
          # printing nothing at all, which is what a failed DLL load looks like
          # rather than a missing executable.
          # Search the install roots directly. Walking up from swift.exe needs
          # exactly four parents (bin -> usr -> 6.3.3+Asserts -> Toolchains ->
          # root) and getting that count wrong lands in Toolchains\Runtimes,
          # which does not exist; the roots are already known, so use them.
          $runtime = Get-ChildItem $roots -Recurse -Filter swiftCore.dll `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($runtime) {
            Write-Host "Runtime DLLs: $($runtime.Directory.FullName)"
            $runtime.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            # Measured once already: without this DLL, swift.exe exits
            # -1073741515 (0xC0000135, STATUS_DLL_NOT_FOUND) printing nothing.
            # There is no point continuing to a compile that cannot start.
            Get-ChildItem $roots -Directory | ForEach-Object { Write-Host "  root entry: $($_.Name)" }
            throw 'swiftCore.dll not found under the Swift install root; swift.exe cannot start.'
          }
      # swift.exe runs at this point but cannot compile: "unable to load standard
      # library for target x86_64-unknown-windows-msvc". The Windows toolchain
      # does not carry its own libc or linker — it compiles against the MSVC
      # toolset and the Windows SDK, whose INCLUDE/LIB/PATH normally come from a
      # Visual Studio developer prompt. GitHub's runner has VS 2022 but starts a
      # plain shell, so import that environment explicitly and point SDKROOT at
      # the Swift platform SDK.
      - name: Import the MSVC and Windows SDK environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere." }
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio install with the x86/x64 C++ toolset.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars." }
          # Run vcvars in cmd, then copy the variables it set into GITHUB_ENV so
          # they survive into the next step — a bat file cannot alter this shell.
          $captured = 0
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|UCRTVersion|UniversalCRTSdkDir|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
              $captured++
            } elseif ($_ -match '^PATH=(.*)$') {
              $Matches[1] -split ';' | Where-Object { $_ } |
                Out-File $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          if ($captured -eq 0) { throw 'vcvars64.bat set no INCLUDE/LIB variables.' }
          Write-Host "Imported $captured MSVC variables."
          $sdk = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Platforms" -Recurse `
            -Filter 'Windows.sdk' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdk) { throw 'Swift Windows.sdk not found under Platforms.' }
          Write-Host "SDKROOT: $($sdk.FullName)"
          "SDKROOT=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          # The test binaries link against XCTest.dll and Testing.dll, which ship
          # in their own platform trees rather than beside the compiler. Without
          # them on PATH the freshly built .xctest starts and dies immediately at
          # -1073741510 (0xC000013A) having printed no test output at all, which
          # reads like a hang or a cancelled run rather than a missing library.
          # The XCTest/Testing DLLs are deliberately NOT added here: the job only
          # builds, and adding them changed nothing when tests were attempted.
          # Their location is recorded in the scope comment on the build step.
      # SCOPE: this job proves the portable core COMPILES on Windows. It does not
      # run the tests, and must not be read as if it did.
      #
      # Everything builds — every target plus azpdf-engine, in about 90s. But
      # `swift test` then exits -1073741510 (0xC000013A, STATUS_CONTROL_C_EXIT)
      # without printing a single test line, and PowerShell reads that status as
      # an interrupt and drops into debug mode, so it looks like a cancelled run.
      # Ruled out by measurement, not assumption. The exit code is identical across
      # four configurations, each one actually run in CI rather than reasoned about:
      #   1. no XCTest/Testing DLL directory on PATH
      #   2. all three architectures on PATH (bin32 + bin64 + bin64a)
      #   3. bin64 only
      #   4. bin64 present AND `swift test --disable-swift-testing`
      # Run 30655416779 logged the fourth: the DLL was found and added to PATH,
      # `Build complete! (1.97s)`, then exit -1073741510 again. So it is neither the
      # missing test runtime nor the swift-testing runner — both were the obvious
      # suspects and both are now eliminated.
      #
      # Chạy thẳng binary test thì ĐI XA HƠN NHIỀU — đây là kết quả đo, không phải suy đoán:
      #   lần 5: gọi .xctest trong pipeline PowerShell → "Cannot run a document in the
      #          middle of a pipeline". Lỗi ở CÁCH GỌI, chưa chạm tới binary.
      #   lần 6: copy sang .exe rồi chạy qua cmd → 9/14 suite CHẠY THẬT, 27 test, 0 fail,
      #          rồi đứt giữa MuPDFDocumentEngineTests.
      #   lần 7: nạp thêm mutool.exe → 13/14 suite, 32 test, 0 fail, VẪN đứt đúng
      #          MuPDFDocumentEngineTests (run 30658607145).
      # Nên `swift test` báo 0xC000013A chưa bao giờ có nghĩa "Windows không chạy được
      # test". Test chạy tốt; đúng MỘT suite giết tiến trình. Linux chạy 14 suite/60 test
      # để đối chiếu.
      #
      # Chưa làm thành gate: một lần chạy bị cụt ở suite đã biết thì không phải bằng chứng
      # "Windows đạt" — gate lên nó là tự dối. Hướng tiếp: tìm xem
      # MuPDFDocumentEngineTests làm gì mà các suite spawn khác không làm.
      # DLL ở Platforms\6.3.3\Windows.platform\Developer\Library\{XCTest,Testing}-6.3.3\usr\bin64.
      #
      # Windows is NOT unverified, though: `azpdf-engine selftest` below runs the
      # Foundation-only conformance harness through MuPDF and is a real behavioural
      # check — it fails the job if any operation regresses.
      #
      # Not made non-blocking on purpose: a step that cannot fail is worthless —
      # that lesson cost this repo two fail-open security gates. Better a job with
      # an honest, narrow contract than a green tick that means nothing.
      - name: Build portable core
        shell: pwsh
        run: |
          # GitHub's pwsh shell only checks the exit code of the LAST command, so
          # an earlier failure would otherwise be masked. Check each one.
          $version = & swift --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            # Exit 1 with no output means swift.exe could not start (runtime DLL),
            # not that anything failed to compile. Say which, with the evidence.
            Write-Host "swift --version exited $LASTEXITCODE"
            Write-Host ($version | Out-String)
            Write-Host 'Swift entries on PATH:'
            $env:PATH -split ';' | Where-Object { $_ -match 'Swift' } |
              ForEach-Object { Write-Host "  $_" }
            throw 'Swift is installed but will not run on this runner.'
          }
          Write-Host ($version | Out-String)
          # --build-tests compiles the test targets without running them, so a
          # test that stops compiling on Windows still fails this job.
          swift build --build-tests
          if ($LASTEXITCODE -ne 0) { throw "swift build --build-tests failed ($LASTEXITCODE)." }
          swift build -c release --product azpdf-engine
          if ($LASTEXITCODE -ne 0) { throw "swift build failed ($LASTEXITCODE)." }
      # Windows CHẠY ĐỦ BỘ TEST. Trước đây không — `swift test` chết ở
      # -1073741510 (0xC000013A, STATUS_CONTROL_C_EXIT) và bảy lần đo mới ra nguyên nhân:
      # swift-subprocess cài `.gracefulShutDown` bằng
      # `GenerateConsoleCtrlEvent(CTRL_C_EVENT, 0)`, mà group 0 là MỌI tiến trình trên
      # console — kể cả chính test host. Mã lỗi nghĩa đen là "bị Ctrl+C". Sửa ở
      # Adapters/MuPDF/MuPDFDocumentEngine.swift (bỏ teardown trên Windows).
      #
      # Vẫn chạy binary trực tiếp chứ không qua `swift test`: PowerShell từ chối chạy file
      # đuôi .xctest ("Cannot run a document in the middle of a pipeline"), nên copy sang
      # .exe và gọi qua cmd.
      #
      # Gate theo NỘI DUNG chứ không chỉ theo exit code: phải có dòng tổng kết cuối và
      # số failure bằng 0. Thiếu dòng tổng kết = chạy bị cụt, và một lần chạy cụt không
      # được tính là đạt.
      - name: Run the full test suite on Windows
        shell: pwsh
        run: |
          $dirs = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Platforms" -Recurse `
            -Include 'XCTest.dll','Testing.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'bin64' } |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique
          foreach ($d in $dirs) { $env:PATH = "$d;$env:PATH" }
          $zip = Join-Path $env:RUNNER_TEMP 'mupdf-t.zip'
          curl.exe -fL 'https://casper.mupdf.com/downloads/archive/mupdf-1.28.0-windows.zip' -o $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($h -ne 'a0ee869bf38ee66b19cd30c281d04e91215f812f0cb20177cd1f69c74c33eb22') { throw "mutool SHA: $h" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\mt" -Force
          $md = (Get-ChildItem "$env:RUNNER_TEMP\mt" -Recurse -Filter 'mutool.exe' | Select-Object -First 1).Directory.FullName
          $env:PATH = "$md;$env:PATH"; $env:AZPDF_MUTOOL = Join-Path $md 'mutool.exe'
          swift build --build-tests
          if ($LASTEXITCODE -ne 0) { throw "build --build-tests failed" }
          $b = Get-ChildItem .build -Recurse -Filter '*.xctest' | Select-Object -First 1
          if (-not $b) { throw 'khong tim thay binary test' }
          $exe = Join-Path $env:RUNNER_TEMP 'AZpdfTests.exe'
          Copy-Item $b.FullName $exe -Force
          $out = cmd /c "`"$exe`" 2>&1" | Out-String
          Write-Host $out
          # Dạng có skip dùng " and " chứ không phải dấu phẩy:
          #   "Executed 60 tests, with 14 tests skipped and 0 failures"
          # Regex chỉ nhận dấu phẩy sẽ bỏ qua đúng dòng tổng kết và lấy nhầm một
          # dòng suite lẻ — chính lỗi đó khiến lần trước đọc ra "4 test".
          $m = [regex]::Matches($out, 'Executed (\d+) tests?, with (?:(\d+) tests? skipped(?:,| and) )?(\d+) failures?')
          if ($m.Count -eq 0) { throw 'khong co dong tong ket — lan chay bi cut, khong tinh la dat' }
          $last = $m[$m.Count - 1]
          $total = [int]$last.Groups[1].Value
          $failed = [int]$last.Groups[3].Value
          Write-Host "TONG KET: $total test, $failed failure"
          if ($failed -ne 0) { throw "$failed test that bai tren Windows" }
          if ($total -lt 50) { throw "chi $total test chay — qua it so voi 60 tren Linux, nghi bi cut" }
      # KIỂM CHỨNG giả thuyết console-control: trước khi sửa, chạy thẳng test binary
      # cho 13/14 suite rồi chết ở MuPDFDocumentEngineTests. Nếu nguyên nhân đúng là
      # gracefulShutDown gửi CTRL_C tới cả console, thì sau khi bỏ nó trên Windows
      # phải chạy đủ 14/14.
      - name: Run azpdf-engine selftest (first behavioral check on Windows)
        shell: pwsh
        run: |
          # Everything above only proves the code COMPILES. This is the first *behavioral*
          # check windows-core has ever run: the Foundation-only conformance harness
          # (`azpdf-engine selftest`, B1.2) driven through the MuPDF engine with a pinned
          # mutool.exe. `unsupported` is NOT failure (MuPDF supports 3/20 by design); only a
          # non-empty `failedOperations` exits non-zero.
          $zip = Join-Path $env:RUNNER_TEMP 'mupdf-1.28.0-windows.zip'
          curl.exe -fL 'https://casper.mupdf.com/downloads/archive/mupdf-1.28.0-windows.zip' -o $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $expected = 'a0ee869bf38ee66b19cd30c281d04e91215f812f0cb20177cd1f69c74c33eb22'
          if ($actual -ne $expected) { throw "mutool zip SHA256 mismatch: expected $expected, got $actual" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $mutool = Join-Path $env:RUNNER_TEMP 'mupdf-1.28.0-windows\mutool.exe'
          if (-not (Test-Path $mutool)) { throw "mutool.exe not found in archive at $mutool" }
          $engine = Get-ChildItem .build -Recurse -Filter 'azpdf-engine.exe' | Select-Object -First 1
          if (-not $engine) { throw 'azpdf-engine.exe was not produced by the release build.' }
          Write-Host '--- azpdf-engine selftest (MuPDF conformance on Windows) ---'
          & $engine.FullName selftest --mutool $mutool
          if ($LASTEXITCODE -ne 0) { throw "azpdf-engine selftest exited $LASTEXITCODE — failedOperations must be empty (unsupported is fine)." }
      # The engine half of a Windows smoke test. It cannot be built on a Mac or
      # in the Linux container, so CI is the only place it exists.
      - name: Stage the engine for the smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path win-engine | Out-Null
          $engine = Get-ChildItem .build -Recurse -Filter 'azpdf-engine.exe' |
            Select-Object -First 1
          if (-not $engine) { throw 'azpdf-engine.exe was not produced by the release build.' }
          Copy-Item $engine.FullName win-engine\
          # Ship the Swift runtime DLLs beside it: the machine under test has no
          # Swift toolchain, so without these the exe cannot start there, and the
          # failure would look like a bug in the engine rather than a packaging gap.
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes" -Recurse -Filter '*.dll' |
            Where-Object { $_.Directory.Name -eq 'bin' } |
            ForEach-Object { Copy-Item $_.FullName win-engine\ -ErrorAction SilentlyContinue }
          Get-ChildItem win-engine | ForEach-Object { Write-Host "  $($_.Name)" }
      - uses: actions/upload-artifact@v4
        with:
          name: azpdf-engine-windows-x64
          path: win-engine/
          if-no-files-found: error

  windows-shell:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Flutter SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'flutter_windows_3.44.0-stable.zip'
          curl.exe -fL `
            'https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.44.0-stable.zip' `
            -o $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = '88da00194893bf9543fc47c0bf31e6de978d49ffdb9c2f6e30c46dde0116c768'
          if ($actual -ne $expected) { throw "Flutter SDK checksum mismatch: $actual" }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'flutter\bin') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Analyze, test and build Windows desktop shell
        shell: pwsh
        working-directory: Shell/azpdf_desktop
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
      - name: Stage the desktop shell for the smoke test
        shell: pwsh
        working-directory: Shell/azpdf_desktop
        run: |
          $bundle = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$bundle\azpdf_desktop.exe")) {
            throw "azpdf_desktop.exe not found in $bundle."
          }
          Get-ChildItem $bundle | ForEach-Object { Write-Host "  $($_.Name)" }
      - uses: actions/upload-artifact@v4
        with:
          name: azpdf-shell-windows-x64
          path: Shell/azpdf_desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
